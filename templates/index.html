<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Versiones de vistas INSOR_DM</title>
  <style>
    :root {
      --bg: #eef1f6;
      --surface: #ffffff;
      --surface-2: #f5f7fb;
      --border: #e3e7ee;
      --text: #161a23;
      --text-muted: #66707e;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-soft: #eef0ff;
      --ok: #05966e; --ok-bg: #e9fbf3; --ok-bd: #a7ecc9;
      --bad: #d92d20; --bad-bg: #fef2f1; --bad-bd: #fecdca;
      --miss: #94a0b3;
      --diff-add-bg: #dcfbe4; --diff-add-bd: #86e0a4; --diff-add-row: #f0fdf5;
      --diff-sub-bg: #ffdcda; --diff-sub-bd: #f3a8a2; --diff-sub-row: #fef4f3;
      --diff-chg-bg: #fdedad; --diff-chg-bd: #f0d264; --diff-chg-row: #fffbef;
      --radius: 14px;
      --radius-sm: 9px;
      --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 6px 20px -4px rgba(16, 24, 40, .10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #23262e; --surface: #2c303a; --surface-2: #343945; --border: #454b59;
        --text: #e7e9ee; --text-muted: #a4abb9;
        --primary: #918dfb; --primary-hover: #aca8fc; --primary-soft: #383a5c;
        --ok: #4ddba3; --ok-bg: #30463e; --ok-bd: #3f6b58;
        --bad: #fa8c83; --bad-bg: #4a3230; --bad-bd: #6e433f;
        --miss: #8891a1;
        --diff-add-bg: rgba(46, 194, 108, .38); --diff-add-bd: rgba(58, 214, 122, .8); --diff-add-row: rgba(46, 194, 108, .14);
        --diff-sub-bg: rgba(248, 81, 73, .35); --diff-sub-bd: rgba(248, 100, 92, .75); --diff-sub-row: rgba(248, 81, 73, .14);
        --diff-chg-bg: rgba(230, 179, 33, .35); --diff-chg-bd: rgba(230, 190, 60, .75); --diff-chg-row: rgba(230, 179, 33, .13);
        --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 8px 20px -6px rgba(0, 0, 0, .35);
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, "Segoe UI", Arial, sans-serif; margin: 0; min-height: 100vh;
      background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 20px 72px; }

    header.top { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
    .logo { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), #8b7ef8); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; box-shadow: var(--shadow); }
    h1 { font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
    p.sub { margin: 3px 0 0; color: var(--text-muted); font-size: 13.5px; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 18px; box-shadow: var(--shadow); animation: fadeIn .35s ease; }
    h2 { font-size: 14.5px; font-weight: 700; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }

    label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 7px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; }
    input, select {
      width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 14px; background: var(--surface-2); color: var(--text); transition: border-color .15s, box-shadow .15s, background .15s;
    }
    input:focus, select:focus {
      outline: none; border-color: var(--primary); background: var(--surface);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent);
    }
    select {
      appearance: none; -webkit-appearance: none; padding-right: 36px; cursor: pointer;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='none' stroke='%2366707e' stroke-width='1.6'><path d='M6 8l4 4 4-4' stroke-linecap='round' stroke-linejoin='round'/></svg>");
      background-repeat: no-repeat; background-position: right 12px center; background-size: 14px;
    }
    select:disabled { opacity: .45; cursor: not-allowed; }

    .searchbar { display: flex; gap: 10px; }
    .searchbar > div { flex: 1; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; }

    button {
      background: var(--primary); color: #fff; border: 0; padding: 11px 20px; border-radius: var(--radius-sm);
      font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .15s, transform .1s, box-shadow .15s;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .08);
    }
    button:hover:not(:disabled) { background: var(--primary-hover); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .55; cursor: default; }

    .hint { font-size: 12.5px; color: var(--text-muted); margin-top: 10px; min-height: 16px; }
    .error { color: var(--bad); font-size: 14px; font-weight: 500; }
    .muted { color: var(--text-muted); font-size: 13px; }

    table.summary { width: 100%; border-collapse: collapse; font-size: 13px; }
    .summary-wrap { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    table.summary th, table.summary td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--border); }
    table.summary tbody tr:last-child td { border-bottom: 0; }
    table.summary th { background: var(--surface-2); font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--text-muted); }
    table.summary tbody tr { transition: background .1s; }
    table.summary tbody tr:hover { background: var(--surface-2); }

    .group-badge { display: inline-flex; align-items: center; justify-content: center; width: 21px; height: 21px; border-radius: 50%; font-size: 10.5px; font-weight: 700; color: #fff; margin-right: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.15); }

    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600; border: 1px solid transparent; }
    .pill-ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-bd); }
    .pill-bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad-bd); }
    .pill-miss { background: var(--surface-2); color: var(--miss); border-color: var(--border); }

    .lede { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 13.5px; color: var(--text-muted); }
    .lede strong { color: var(--text); }

    .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 14px; font-size: 12.5px; color: var(--text-muted); }
    .legend span.item { display: inline-flex; align-items: center; }
    .legend .sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid rgba(0,0,0,.08); }

    .banner { border-radius: var(--radius-sm); padding: 13px 16px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .banner.ok { background: var(--ok-bg); border: 1px solid var(--ok-bd); color: var(--ok); }
    .banner-icon { width: 24px; height: 24px; border-radius: 50%; background: var(--ok); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }

    .stats { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
    .badge { background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; }
    .badge strong { color: var(--text); }

    .difftable-wrap { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: auto; max-height: 68vh; }
    table.diff { table-layout: fixed; border-collapse: collapse; width: 100%; font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace; font-size: 12.5px; }
    table.diff colgroup:nth-child(1), table.diff colgroup:nth-child(4) { width: 22px; }
    table.diff colgroup:nth-child(2), table.diff colgroup:nth-child(5) { width: 42px; }
    /* las columnas de contenido (3ra y 6ta) se reparten el ancho restante en partes iguales */
    table.diff thead th.diff_header { position: sticky; top: 0; z-index: 1; background: var(--primary); color: #fff; font-weight: 600; text-align: left; padding: 9px 12px; font-family: system-ui, "Segoe UI", Arial, sans-serif; font-size: 12.5px; }
    table.diff thead th.diff_next { position: sticky; top: 0; z-index: 1; background: var(--primary); }
    table.diff tbody td { padding: 3px 10px; vertical-align: top; }
    table.diff tbody td.diff_header { background: var(--surface-2); color: var(--miss); text-align: right; user-select: none; border-right: 1px solid var(--border); white-space: nowrap; }
    table.diff tbody td.diff_next { text-align: center; width: 20px; }
    table.diff tbody td.diff_next a { color: var(--miss); text-decoration: none; font-size: 10px; }
    /* las lineas de SQL pueden ser muy largas: se ajustan al ancho de la columna en vez de forzar scroll horizontal */
    table.diff tbody td[nowrap] { white-space: pre-wrap; overflow-wrap: anywhere; }
    /* lavado suave en toda la linea afectada + resaltado mas saturado en el tramo exacto que cambio */
    table.diff tbody tr:has(.diff_sub) td:nth-child(3) { background: var(--diff-sub-row); }
    table.diff tbody tr:has(.diff_add) td:nth-child(6) { background: var(--diff-add-row); }
    table.diff tbody tr:has(.diff_chg) td:nth-child(3) { background: var(--diff-sub-row); }
    table.diff tbody tr:has(.diff_chg) td:nth-child(6) { background: var(--diff-add-row); }
    table.diff .diff_add { background: var(--diff-add-bg); border: 1px solid var(--diff-add-bd); border-radius: 3px; }
    table.diff .diff_sub { background: var(--diff-sub-bg); border: 1px solid var(--diff-sub-bd); border-radius: 3px; }
    table.diff .diff_chg { background: var(--diff-chg-bg); border: 1px solid var(--diff-chg-bd); border-radius: 3px; }
    table.diff tbody tr:has(> td.diff_header:empty) { background: var(--surface-2); }
    table.diff tbody tr:has(> td.diff_header:empty) td.diff_header { background: var(--border); }
    /* cada bloque de cambio (con su contexto) llega en su propio <tbody>: separarlos visualmente */
    table.diff tbody + tbody tr:first-child td { border-top: 2px dashed var(--border); padding-top: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="logo">🔍</div>
      <div>
        <h1>Versiones de vistas — INSOR_DM</h1>
        <p class="sub">Compara el SQL (el SELECT del CREATE VIEW) de una misma vista entre ambientes GDS/RAWDB.</p>
      </div>
    </header>

    <div class="card">
      <label for="viewName">Nombre de la vista</label>
      <div class="searchbar">
        <div>
          <input id="viewName" list="viewNames" placeholder="Ej: CAR_IND_DANIOS_VIEW" autocomplete="off" />
          <datalist id="viewNames"></datalist>
        </div>
        <button id="btnBuscar">Buscar en todos los ambientes</button>
      </div>
      <div class="hint" id="hint"></div>
    </div>

    <div class="card" id="summaryCard" style="display:none">
      <h2>Resumen por ambiente</h2>
      <div id="summaryBody"></div>
    </div>

    <div class="card" id="compareCard" style="display:none">
      <h2>Comparar dos ambientes</h2>
      <div class="row3">
        <div>
          <label for="envA">Ambiente A</label>
          <select id="envA">
            {% for e in environments %}<option value="{{ e.key }}">{{ e.label }}</option>{% endfor %}
          </select>
        </div>
        <div>
          <label for="envB">Ambiente B</label>
          <select id="envB">
            {% for e in environments %}<option value="{{ e.key }}">{{ e.label }}</option>{% endfor %}
          </select>
        </div>
        <button id="btnDiff">Comparar</button>
      </div>
      <div id="diffResult" style="margin-top:16px"></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const viewNameEl = $("viewName"), hintEl = $("hint"), btnBuscar = $("btnBuscar");
    const summaryCard = $("summaryCard"), summaryBody = $("summaryBody");
    const compareCard = $("compareCard"), envA = $("envA"), envB = $("envB");
    const btnDiff = $("btnDiff"), diffResult = $("diffResult");

    const ENV_ORDER = [{% for e in environments %}"{{ e.key }}",{% endfor %}];
    const ENV_LABEL = {{ environments|tojson }}.reduce((m, e) => (m[e.key] = e.label, m), {});
    const GROUP_COLORS = ["#4f46e5", "#0e9384", "#b54708", "#c11574", "#2563eb"];

    let lastVersions = null; // { env_key: {found, sql, ...} }
    let viewNamesLoadedFor = null;

    async function loadViewNames(envKey) {
      if (viewNamesLoadedFor === envKey) return;
      try {
        const res = await fetch("/views?env=" + encodeURIComponent(envKey));
        const data = await res.json();
        if (!res.ok || !data.views) return;
        viewNamesLoadedFor = envKey;
        const dl = $("viewNames");
        dl.innerHTML = data.views.map(v => `<option value="${v}"></option>`).join("");
      } catch { /* autocompletar es best-effort */ }
    }

    viewNameEl.addEventListener("focus", () => {
      loadViewNames(envA.value || ENV_ORDER[0]);
    });

    btnBuscar.addEventListener("click", buscar);
    viewNameEl.addEventListener("keydown", (e) => { if (e.key === "Enter") buscar(); });

    async function buscar() {
      const viewName = viewNameEl.value.trim();
      if (!viewName) { viewNameEl.focus(); return; }

      btnBuscar.disabled = true; btnBuscar.textContent = "Consultando ambientes...";
      hintEl.textContent = "Abriendo tuneles y consultando DBA_VIEWS en cada ambiente (puede tardar la primera vez)...";
      summaryCard.style.display = "none";
      compareCard.style.display = "none";
      diffResult.innerHTML = "";

      try {
        const res = await fetch("/versions", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ view_name: viewName })
        });
        const data = await res.json();
        if (!res.ok) { hintEl.innerHTML = '<span class="error">' + (data.error || "Error") + '</span>'; return; }
        hintEl.textContent = "";
        lastVersions = data.environments;
        renderSummary(data.view_name, lastVersions);
        setupCompare(lastVersions);
      } catch (err) {
        hintEl.innerHTML = '<span class="error">Error de red: ' + err + '</span>';
      } finally {
        btnBuscar.disabled = false; btnBuscar.textContent = "Buscar en todos los ambientes";
      }
    }

    function groupByMd5(versions) {
      const groups = []; // [{ md5, envs: [] }]
      for (const key of ENV_ORDER) {
        const v = versions[key];
        if (!v || !v.found) continue;
        let g = groups.find(g => g.md5 === v.md5);
        if (!g) { g = { md5: v.md5, envs: [] }; groups.push(g); }
        g.envs.push(key);
      }
      return groups;
    }

    function renderSummary(viewName, versions) {
      const groups = groupByMd5(versions);
      const groupIndex = {};
      groups.forEach((g, i) => g.envs.forEach(e => groupIndex[e] = i));

      let html = `<div class="lede">Vista <strong>${viewName}</strong> — `;
      if (groups.length <= 1 && groups.length > 0) {
        html += `<span class="pill pill-ok">✓ SQL idéntico en todos los ambientes</span>`;
      } else if (groups.length > 1) {
        html += `<span class="pill pill-bad">${groups.length} versiones distintas</span>`;
      } else {
        html += `<span class="pill pill-miss">no se encontró en ningún ambiente</span>`;
      }
      html += `</div><div class="summary-wrap"><table class="summary"><thead><tr><th>Ambiente</th><th>Esquema</th><th>Estado</th><th>Líneas</th><th>Caracteres</th></tr></thead><tbody>`;

      for (const key of ENV_ORDER) {
        const v = versions[key];
        html += `<tr><td>${ENV_LABEL[key]}</td>`;
        if (v && v.found) {
          const gi = groupIndex[key];
          const color = GROUP_COLORS[gi % GROUP_COLORS.length];
          const letter = String.fromCharCode(65 + gi);
          html += `<td>${v.owner || "—"}</td>`;
          html += `<td><span class="group-badge" style="background:${color}">${letter}</span><span class="pill pill-ok">✓ Encontrada</span></td>`;
          html += `<td>${v.line_count}</td><td>${v.char_count}</td>`;
        } else if (v && v.error) {
          html += `<td>—</td><td><span class="pill pill-bad">✕ No se pudo conectar: ${v.error}</span></td><td>—</td><td>—</td>`;
        } else {
          html += `<td>—</td><td><span class="pill pill-miss">– No existe</span></td><td>—</td><td>—</td>`;
        }
        html += `</tr>`;
      }
      html += `</tbody></table></div>`;

      if (groups.length > 1) {
        html += `<div class="legend">` + groups.map((g, i) =>
          `<span class="item"><span class="sw" style="background:${GROUP_COLORS[i % GROUP_COLORS.length]}"></span>Versión ${String.fromCharCode(65 + i)}: ${g.envs.map(k => ENV_LABEL[k]).join(", ")}</span>`
        ).join("") + `</div>`;
      }

      summaryBody.innerHTML = html;
      summaryCard.style.display = "block";
    }

    function setupCompare(versions) {
      const found = ENV_ORDER.filter(k => versions[k] && versions[k].found);
      if (found.length < 1) { compareCard.style.display = "none"; return; }

      const groups = groupByMd5(versions);
      let defaultA, defaultB;
      if (groups.length >= 2) {
        defaultA = groups[0].envs[0];
        defaultB = groups[1].envs[0];
      } else if (found.includes("UAT") && found.includes("STST")) {
        defaultA = "UAT"; defaultB = "STST";
      } else {
        defaultA = found[0]; defaultB = found[1] || found[0];
      }

      for (const sel of [envA, envB]) {
        [...sel.options].forEach(o => o.disabled = !found.includes(o.value));
      }
      envA.value = defaultA;
      envB.value = defaultB;
      compareCard.style.display = "block";
      runDiff();
    }

    btnDiff.addEventListener("click", runDiff);

    async function runDiff() {
      if (!lastVersions) return;
      const a = lastVersions[envA.value], b = lastVersions[envB.value];
      if (!a || !a.found) { diffResult.innerHTML = `<span class="error">La vista no existe en ${ENV_LABEL[envA.value]}.</span>`; return; }
      if (!b || !b.found) { diffResult.innerHTML = `<span class="error">La vista no existe en ${ENV_LABEL[envB.value]}.</span>`; return; }
      if (envA.value === envB.value) { diffResult.innerHTML = `<span class="muted">Elegí dos ambientes distintos para comparar.</span>`; return; }

      btnDiff.disabled = true; btnDiff.textContent = "Comparando...";
      diffResult.innerHTML = '<span class="muted">Calculando diferencias...</span>';
      try {
        const res = await fetch("/diff", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            sql_a: a.sql, sql_b: b.sql,
            label_a: ENV_LABEL[envA.value], label_b: ENV_LABEL[envB.value],
          })
        });
        const data = await res.json();
        if (!res.ok) { diffResult.innerHTML = '<span class="error">' + (data.error || "Error") + '</span>'; return; }
        renderDiff(data);
      } catch (err) {
        diffResult.innerHTML = '<span class="error">Error de red: ' + err + '</span>';
      } finally {
        btnDiff.disabled = false; btnDiff.textContent = "Comparar";
      }
    }

    function renderDiff(data) {
      const s = data.stats;
      if (s.identical) {
        diffResult.innerHTML = `<div class="banner ok"><span class="banner-icon">✓</span>El SQL es idéntico entre ${ENV_LABEL[envA.value]} y ${ENV_LABEL[envB.value]} (${s.lines_a} líneas).</div>`;
        return;
      }
      let html = `<div class="stats">` +
        `<span class="badge">Similitud: <strong>${s.similarity}%</strong></span>` +
        `<span class="badge">${ENV_LABEL[envA.value]}: <strong>${s.lines_a}</strong> líneas</span>` +
        `<span class="badge">${ENV_LABEL[envB.value]}: <strong>${s.lines_b}</strong> líneas</span>` +
        `</div>` +
        `<div class="legend" style="margin-top:0;margin-bottom:12px">` +
        `<span class="item"><span class="sw" style="background:var(--diff-add-bg);border-color:var(--diff-add-bd)"></span>Agregado</span>` +
        `<span class="item"><span class="sw" style="background:var(--diff-sub-bg);border-color:var(--diff-sub-bd)"></span>Eliminado</span>` +
        `<span class="item"><span class="sw" style="background:var(--diff-chg-bg);border-color:var(--diff-chg-bd)"></span>Modificado</span>` +
        `</div>` +
        `<div class="difftable-wrap">${data.html}</div>`;
      diffResult.innerHTML = html;
    }
  </script>
</body>
</html>
